# Consumer workflow for the OWASP-CTF/securityshepherd CTF fork.
#
# OWASP-CTF/score-action does everything: checks out the PR head, mints the OIDC id-token,
# builds + boots the app, scores it against the embedded rubric, and records the result.
# Security Shepherd is the heavy target — the action's baked bring-up runs the PR source's Maven
# build and stands up the 3-container stack (Tomcat + MariaDB + MongoDB) over TLS. The PR's
# untrusted code only ever runs inside containers on an --internal network, never on the runner
# host. Do NOT add a step that runs PR-controlled code directly here.
name: score

on:
  pull_request_target:
    branches: [dc34-ctf] # the Security Shepherd fork's CTF branch
    types: [opened, synchronize, reopened]

concurrency:
  group: score-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Maven build + 3-image build + boot + bootstrap is slow
    permissions:
      contents: read # the action checks out the PR head to build the stack
      packages: read # the action pulls the org-internal scorer image
      id-token: write # the action mints the OIDC id-token POST /score authorizes
      pull-requests: write # the result comment
    steps:
      - name: Score + record
        # Pinned to a full commit SHA rather than the mutable @main ref: this job runs under
        # pull_request_target with id-token: write and pull-requests: write in the base repo, so
        # whoever controls that branch would otherwise control those credentials.
        uses: OWASP-CTF/score-action@ab1795f38b78065627d4d8bf449ce7eaffd762ff # main
        with:
          target: securityshepherd
          app-url: https://app:8443
